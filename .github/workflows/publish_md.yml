name: Publish Github Pages

on:
  workflow_dispatch:
    inputs:
      site_ref:
        description: "Branch or tag to use for site code during manual validation"
        required: false
        default: "main"
      deploy_pages:
        description: "Whether to deploy to github-pages after building"
        required: false
        type: boolean
        default: true
  # Independent of the paper chain on purpose. Hotspots are generated off-site
  # and pushed straight to auto_update with [skip ci], so nothing about that
  # push triggers a build. Without this the site only rebuilds when the paper
  # pipeline succeeds -- and arXiv announces nothing at weekends, so Saturday
  # and Sunday hotspots would sit on the branch unseen until Monday.
  schedule:
    - cron: '0 6 * * *'   # after the 05:00 UTC hotspot slot
  workflow_run:
    workflows: [ "Push Generated Results" ]
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish_md.yml"
      - "web/**"
      - "scripts/**"
      - "site.css"
      - "requirements.txt"
      - "arxiv_assistant/**"

permissions:
  # write, not read: the translation step now persists what it produced back
  # to auto_update. Without that the work is thrown away with the runner
  # workspace and every build re-translates the whole archive from scratch.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # This build takes about 67 minutes, almost all of it in the translation
  # step. With cancel-in-progress: true, any later trigger killed the run in
  # flight, and the triggers above include pushes to main touching
  # arxiv_assistant/**, scripts/** or requirements.txt. Between 2026-09-15 and
  # 2026-09-19 five consecutive builds died that way and the site went stale
  # for four days: ordinary development on main was starving the publish.
  # Queueing is the right shape here. GitHub keeps at most one run pending per
  # group, so a burst of pushes cannot pile up -- the newest one waits and the
  # rest are dropped, while the build already running is allowed to finish.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SITE_CODE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.site_ref || 'main' }}

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [ self-hosted, windows ]

    steps:
      - name: Checkout site code branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SITE_CODE_REF }}
          fetch-depth: 0

      - name: Checkout `auto_update` branch for generated outputs
        uses: actions/checkout@v6
        with:
          ref: auto_update
          path: auto_update_data
          fetch-depth: 0

      - name: Restore published data snapshot
        shell: bash
        run: |
          rm -rf out
          if [ -d "auto_update_data/out" ] && [ "$(ls -A auto_update_data/out)" ]; then
            cp -R auto_update_data/out ./out
            echo "Contents in restored out/:"
            ls -R out
          else
            echo "auto_update_data/out is empty or does not exist. Aborting."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rebuild hotspot web data
        shell: bash
        run: |
          python scripts/rebuild_hotspot_web_data.py --output-root out

      - name: Translate hotspot web data
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        shell: bash
        run: |
          python -X utf8 scripts/translate_hotspot_web_data.py

      - name: Validate _zh translation assets
        id: validate_zh
        shell: bash
        run: |
          python scripts/validate_zh_assets.py

      - name: Persist translations back to auto_update
        # Translation is the most expensive step here and it used to be the most
        # wasteful. `Restore published data snapshot` copies a clean out/ from
        # auto_update on every run, the translator adds _zh fields in place, the
        # site is built from them, and the workspace is discarded. Nothing wrote
        # them back, so auto_update carried _zh only through 2026-04-04 and every
        # later build retranslated about 160 days to throw the result away. That
        # was merely expensive while the provider chain answered quickly; once it
        # slowed down, six hours bought eighteen days, the job hit the 360-minute
        # limit, and the next run began again at the same date.
        #
        # Reconciling by reset rather than rebase is deliberate. The daily
        # pipeline rewrites these same files with fresher hotspot data while this
        # build runs, so committing our hour-old copies and rebasing would collide
        # on every shared line, and copying them over would win the race by
        # reverting that pipeline's work. The two writers do not actually
        # disagree: it owns the content, this build owns the _zh fields beside it.
        # So take whatever is on the branch now and move only the translations
        # onto it.
        #
        # Runs after validation on purpose: a translation the validator rejects
        # should not reach the branch every later build is seeded from.
        if: always() && steps.validate_zh.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git -C auto_update_data fetch origin auto_update
            git -C auto_update_data reset --hard origin/auto_update
            python scripts/persist_zh_translations.py \
              --source out/web_data/hot \
              --target auto_update_data/out/web_data/hot
            cd auto_update_data
            # --global, not repo-local, and the difference is load-bearing.
            # This machine routes commit identity by remote URL:
            #   includeIf "hasconfig:remote.*.url:https://github.com/DaizeDong/**"
            # An includeIf in ~/.gitconfig is applied after the plain global
            # settings, so it overrides them and the commit is attributed to the
            # account that owns this repository, which is what the machine's
            # identity assertion demands. Repo-local config outranks includeIf,
            # so setting it here won, produced a github-actions[bot] author, and
            # the assertion blocked the commit -- after four and a half hours of
            # translating. push_results.yaml has used --global all along; this
            # step was the one that deviated.
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f out/web_data/hot/
            if git diff --cached --quiet; then
              echo "Nothing new to persist."
              exit 0
            fi
            # [skip ci] matters: this branch is an input to this very workflow.
            git commit -m "[skip ci] Persist hotspot translations: $(date -u +"%Y-%m-%d %H:%M:%S")"
            if git push origin HEAD:auto_update; then
              echo "Translations persisted on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt lost a race; re-reading the branch and retrying."
            cd ..
            sleep 5
          done
          echo "Could not persist translations after 3 attempts."
          exit 1

      - name: Build multipage site
        shell: bash
        run: |
          python -m arxiv_assistant.renderers.build_multipage_site

      - name: Render static site
        shell: bash
        run: |
          python -m arxiv_assistant.renderers.render_static_site --site-root out/site --dist-root dist --css-source site.css

      - name: Install hotspot web dependencies
        working-directory: web
        shell: bash
        run: |
          npm ci

      - name: Build hotspot web app
        working-directory: web
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        shell: bash
        run: |
          npm run build

      - name: Merge hotspot web app into dist
        shell: bash
        run: |
          python scripts/merge_hotspot_web_dist.py --web-dist web/dist --site-dist dist

      - name: Bust custom CSS cache
        shell: bash
        run: |
          find dist -name '*.html' -exec \
            sed -i "s#site\\.css\\([\"']\\)#site.css?v=${GITHUB_SHA}\\1#g" {} +

      - name: Copy static assets
        shell: bash
        run: |
          if [ -d assets ]; then
            mkdir -p dist
            cp -R assets dist/
          fi

      - name: Archive Pages artifact
        shell: bash
        run: |
          # --force-local, because this job runs on a Windows runner. RUNNER_TEMP
          # is an absolute Windows path, and GNU tar reads the "C:" in it as the
          # host half of a host:path remote spec: it answers "Cannot connect to
          # C: resolve failed" and exits 128. Nothing else in the run is wrong
          # when this happens -- the translations are already committed by the
          # step above -- but the site cannot publish.
          tar \
            --force-local \
            --dereference --hard-dereference \
            --directory "dist" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .

      - uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' && (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_pages == 'true') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [ self-hosted, windows ]

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4.0.5
        id: deployment
