name: Runner selftest

# Prove a runner before trusting it with real work.
#
# Every runner failure in this repository so far has been a property of the
# machine rather than of the workflows: a Windows runner resolving `shell: bash`
# to WSL's bash.exe, which cannot open a Windows path and dies on every step
# with the backslashes eaten; a Linux runner where setup-python has no build
# for the distribution; a machine whose scheduler simply was not running, which
# looks exactly like a machine that is busy. None of those are visible from the
# outside, and all of them are one dispatch away from being visible here.
#
# Takes the label to test, so it can be pointed at a new machine without
# editing anything, and asserts rather than prints: a selftest that only prints
# is read once and then believed forever.

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Runner label to test (e.g. grokbot, windows)"
        required: true
        default: "grokbot"
      models:
        description: "Optional comma-separated model ids to try instead of the configured one"
        required: false
        default: ""

permissions:
  # The push check below is a dry run, but a dry run still negotiates
  # git-receive-pack, which a read-only token cannot do -- the check would
  # then fail on the token rather than on the machine.
  contents: write

jobs:
  selftest:
    runs-on: [ self-hosted, "${{ github.event.inputs.label }}" ]
    steps:
      - name: Which machine is this
        shell: bash
        run: |
          echo "runner name  : ${RUNNER_NAME:-?}"
          echo "runner os    : ${RUNNER_OS:-?}"
          echo "runner arch  : ${RUNNER_ARCH:-?}"
          echo "uname        : $(uname -a 2>/dev/null || echo n/a)"
          echo "uptime       : $(uptime 2>/dev/null || echo n/a)"

      - name: The shell is a real bash that can open the script it was given
        shell: bash
        run: |
          # This is the WSL trap, asserted rather than described. GitHub
          # resolves `shell: bash` through PATH. On a Windows machine that has
          # both Git Bash and WSL, the runner picks C:\Windows\system32\bash.EXE
          # unless something puts Git Bash first -- and that bash cannot open a
          # Windows path, so every step dies on
          #   /bin/bash: C:actions-runner_work_temp....sh: No such file
          # with the backslashes eaten. If this step runs at all, the shell
          # opened its own script, which is the property that matters. The
          # check below names the binary so a regression is legible.
          echo "bash path    : $(command -v bash)"
          echo "bash version : $(bash --version | head -1)"
          case "$(command -v bash)" in
            /c/Windows/*|/mnt/c/Windows/*|*system32*|*System32*)
              echo "FAIL: this is WSL's bash; Git Bash must come first on PATH" >&2
              exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v6

      - name: setup-python can serve this machine
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python runs, and is the one setup-python selected
        shell: bash
        run: |
          # On Debian 13 the action finds no published build and fails above.
          # When it is satisfied from the tool cache instead, the interpreter
          # is --enable-shared and needs LD_LIBRARY_PATH, which the action
          # exports; running it here is what proves that happened.
          echo "python       : $(command -v python)"
          python -c "import sys; print('version      :', sys.version.split()[0])"
          python -c "import ssl, sqlite3, lzma, ctypes; print('stdlib       : ssl sqlite3 lzma ctypes all import')"
          case "$(python -c 'import sys; print(sys.version.split()[0])')" in
            3.12.*) ;;
            *) echo "FAIL: expected 3.12.x from setup-python" >&2; exit 1 ;;
          esac

      - name: Can this machine reach llmcall, and what does `auto` resolve to
        shell: bash
        continue-on-error: true
        run: |
          # THE SELFTEST BELOW PINS openai, so it proves a backend the production
          # workflows do not choose by default. `auto` resolves to llmcall when the
          # package imports and to the agent transport when it does not, and which one
          # a machine lands on is invisible from the outside: both answer, one of them
          # through a chain that crosses model families and one through a single CLI.
          #
          # This asks the question directly, and asks it BEFORE the pin, so a machine
          # can be told apart from the workflow's opinion of it.
          python -m pip install --quiet -r requirements.txt

          # Where does this machine keep llmcall? An interpreter that already has it,
          # an explicit LLMCALL_SRC for a machine that keeps it somewhere of its own,
          # or the container's tools directory. Tried in that order.
          SRC="${LLMCALL_SRC:-}"
          if [ -z "$SRC" ]; then
            # One candidate per loop item. `for CAND in py -3 python3 python` reads as
            # four words, so it ran `py -c ...` without its version flag and then tried
            # to execute `-3` as a command; it worked on Windows by accident.
            for CAND in "py -3" python3 python; do
              SRC=$($CAND -c "import llmcall, os; print(os.path.dirname(os.path.dirname(llmcall.__file__)))" 2>/dev/null) && [ -n "$SRC" ] && break
              SRC=""
            done
          fi
          [ -z "$SRC" ] && [ -d /workspace/tools/llmcall ] && SRC=/workspace/tools/llmcall
          if [ -n "$SRC" ]; then
            echo "llmcall source: $SRC"
            python -m pip install --quiet "$SRC" || echo "  install from $SRC failed"
          else
            echo "llmcall source: none found on this machine"
          fi

          python - <<'PY'
          from arxiv_assistant.utils import llm_gateway as g
          print("llmcall importable:", g.llmcall_available())
          print("available backends:", g.available_backends())
          print("auto resolves to  :", g.resolve_backend("auto"))
          PY

      - name: The transport `auto` picks actually answers
        env:
          ARXIV_ASSISTANT_LLM_BACKEND: auto
        shell: bash
        continue-on-error: true
        run: |
          # A live call through whatever `auto` chose. Reporting the backend without
          # calling it is the same substitution of presence for capability that the
          # openai step below exists to avoid; this one just aims at the default.
          python - <<'PY'
          from arxiv_assistant.utils import llm_gateway as g
          r = g.call("Reply with exactly: OK", timeout_s=180)
          text = (getattr(r, "text", "") or str(r)).strip()
          print("backend  :", g.resolve_backend("auto"))
          print("reply    :", text[:80] if text else "<EMPTY>")
          for line in (getattr(r, "trace", None) or [])[:8]:
              print("  trace  :", line[:160])
          raise SystemExit(0 if "OK" in text else 1)
          PY

      - name: The model transport answers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          ARXIV_ASSISTANT_LLM_BACKEND: openai
          ARXIV_ASSISTANT_LLM_MODEL: ${{ vars.ARXIV_ASSISTANT_LLM_MODEL }}
          PROBE_MODELS: ${{ github.event.inputs.models }}
        shell: bash
        run: |
          # A live call, because every cheaper check passes on a machine that
          # cannot reach a model. The one this caught: the gateway answers
          # 403 plus_required for the repo's default model while the key is
          # perfectly good, so a build translated nothing and reported success
          # at every step.
          python -m pip install --quiet -r requirements.txt
          python - <<'PY'
          import os, sys, json, urllib.request
          from arxiv_assistant.utils import llm_gateway

          def offered():
              # "Which models will this endpoint actually serve" is the
              # question every failure here turns into, and a model id is not
              # a secret. Printing the list on failure is the difference
              # between one dispatch and a guessing game, because a name the
              # endpoint will not serve is refused in several different ways
              # and none of them names a replacement.
              base = (os.environ.get("OPENAI_BASE_URL") or "").rstrip("/")
              key = os.environ.get("OPENAI_API_KEY") or ""
              if not base:
                  return "no OPENAI_BASE_URL set"
              url = base + ("/models" if base.endswith("/v1") else "/v1/models")
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {key}"})
              extra = os.environ.get("OPENAI_EXTRA_HEADERS")
              if extra:
                  try:
                      for k, v in json.loads(extra).items():
                          req.add_header(k, v)
                  except ValueError:
                      pass
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = json.load(resp)
              except Exception as exc:
                  return f"could not list models: {str(exc)[:120]}"
              ids = sorted(m.get("id", "?") for m in (data.get("data") or []))
              return f"{len(ids)} offered: " + ", ".join(ids[:60])

          def try_once(label):
              try:
                  r = llm_gateway.call("Reply with exactly: OK", timeout_s=120)
              except Exception as exc:
                  print(f"  {label:24} FAIL  {str(exc)[:110]}")
                  return False
              text = (r.text or "").strip()
              print(f"  {label:24} ok    {r.backend}/{r.provider or '-'} -> {text[:20]!r}")
              return bool(text)

          # A shortlist in one run, rather than one dispatch per name. Some
          # names on an endpoint need an entitlement this account may not
          # have, and the refusal never suggests a substitute, so the only way
          # to learn which of them answers is to ask each of them.
          probe = [m.strip() for m in (os.environ.get("PROBE_MODELS") or "").split(",") if m.strip()]
          if probe:
              print(f"probing {len(probe)} model(s):")
              results = []
              for name in probe:
                  os.environ["ARXIV_ASSISTANT_LLM_MODEL"] = name
                  results.append((name, try_once(name)))
              working = [n for n, ok in results if ok]
              print(f"answered     : {', '.join(working) if working else '(none)'}")
              if not working:
                  print(f"gateway says : {offered()}")
              sys.exit(0 if working else 1)

          asked = os.environ.get("ARXIV_ASSISTANT_LLM_MODEL") or "(from config)"
          print(f"model asked  : {asked}")
          if try_once(asked):
              sys.exit(0)
          print(f"gateway says : {offered()}")
          sys.exit(1)
          PY

      - name: Can push to auto_update
        shell: bash
        run: |
          # The publisher's half. A runner that builds perfectly and cannot
          # push produces nothing anyone sees, and fails in the direction that
          # looks like working. --dry-run negotiates git-receive-pack, which
          # GitHub refuses without write access, and creates nothing.
          git push --dry-run \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/__runner_selftest__" >/dev/null 2>&1 \
            && echo "push         : accepted (nothing was created)" \
            || { echo "FAIL: this runner cannot push to the repository" >&2; exit 1; }
