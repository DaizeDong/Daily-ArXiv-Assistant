name: Run daily arxiv

on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: '0 5 * * *'
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build:
    runs-on: [ self-hosted, arxiv-fleet ]

    steps:
      - uses: actions/checkout@v6

      - name: Restore X authority inventory from `auto_update`
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin auto_update >/dev/null 2>&1; then
            git fetch origin auto_update:auto_update_tmp
            if git cat-file -e auto_update_tmp:configs/hotspot/x_authority_inventory.json 2>/dev/null; then
              mkdir -p configs/hotspot
              git show auto_update_tmp:configs/hotspot/x_authority_inventory.json > configs/hotspot/x_authority_inventory.json
              echo "Restored X authority inventory from auto_update."
            else
              echo "auto_update does not contain configs/hotspot/x_authority_inventory.json yet."
            fi
            git branch -D auto_update_tmp >/dev/null 2>&1 || true
          else
            echo "auto_update branch does not exist yet."
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Initialize the job model transport
        shell: bash
        run: python scripts/bootstrap_llmcall.py

      - name: Detect hotspot runtime mode
        id: runtime
        shell: bash
        run: |
          # Through the repository's loader, which reads config.ini AND
          # hotspot.ini. This line used to build its own ConfigParser over
          # config.ini alone, and [HOTSPOT_RUNTIME] lives in hotspot.ini since
          # the config was split by subsystem -- so it found nothing and took
          # the fallback. It happened to be right, because the fallback and the
          # configured value are both "local", which is exactly why nobody
          # noticed: setting runtime = actions would have been ignored in
          # silence and hotspot generation would have gone on being skipped.
          MODE=$(python -c "from arxiv_assistant.utils.config_loader import load_repo_config; print(load_repo_config().get('HOTSPOT_RUNTIME', 'runtime', fallback='local'))")
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Hotspot runtime mode: $MODE"

      - name: Refresh model pricing cache
        shell: bash
        run: |
          python scripts/refresh_model_pricing.py --max-age-hours 24

      - name: Run main
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Explicit backend: bootstrap validates the installed chain before work starts.
          ARXIV_ASSISTANT_LLM_BACKEND: llmcall
          # The repo default is gpt-5.6, which this gateway answers with
          # 403 plus_required -- auth is fine, the tier simply cannot have that
          # model. A repository variable, not a secret: a model name is not one,
          # and it has to be changeable without editing six files.
          ARXIV_ASSISTANT_LLM_MODEL: ${{ vars.ARXIV_ASSISTANT_LLM_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          SLACK_KEY: ${{ secrets.SLACK_KEY }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        shell: bash
        run: |
          python main.py

      - name: Generate daily hotspots (deterministic Actions fallback)
        if: ${{ steps.runtime.outputs.mode == 'actions' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Explicit backend: bootstrap validates the installed chain before work starts.
          ARXIV_ASSISTANT_LLM_BACKEND: llmcall
          # The repo default is gpt-5.6, which this gateway answers with
          # 403 plus_required -- auth is fine, the tier simply cannot have that
          # model. A repository variable, not a secret: a model name is not one,
          # and it has to be changeable without editing six files.
          ARXIV_ASSISTANT_LLM_MODEL: ${{ vars.ARXIV_ASSISTANT_LLM_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Deterministic degraded path: heuristic mode, agents off, no twitterapi secret.
          python scripts/generate_daily_hotspots.py --output-root out --mode heuristic --force

      - name: Skip hotspot generation (VPS owns it)
        if: ${{ steps.runtime.outputs.mode != 'actions' }}
        shell: bash
        run: echo "runtime=local — hotspot generation runs on VPS; Actions is Publisher-only."

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: arxiv-scanner-outputs
          path: out/
          retention-days: 5
