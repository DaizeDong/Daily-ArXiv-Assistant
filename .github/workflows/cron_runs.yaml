name: Run daily arxiv

on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: '0 5 * * *'
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build:
    runs-on: [ self-hosted, arxiv-fleet ]

    steps:
      - uses: actions/checkout@v6

      - name: Restore X authority inventory from `auto_update`
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin auto_update >/dev/null 2>&1; then
            git fetch origin auto_update:auto_update_tmp
            if git cat-file -e auto_update_tmp:configs/hotspot/x_authority_inventory.json 2>/dev/null; then
              mkdir -p configs/hotspot
              git show auto_update_tmp:configs/hotspot/x_authority_inventory.json > configs/hotspot/x_authority_inventory.json
              echo "Restored X authority inventory from auto_update."
            else
              echo "auto_update does not contain configs/hotspot/x_authority_inventory.json yet."
            fi
            git branch -D auto_update_tmp >/dev/null 2>&1 || true
          else
            echo "auto_update branch does not exist yet."
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Make llmcall available to the job's Python
        shell: bash
        continue-on-error: true
        run: |
          # setup-python is isolated from the machine's interpreters. Ask each
          # candidate where llmcall lives and install that path here, so the
          # gateway gets the chain instead of the single-provider fallback.
          # The chain runs CLIs, and setup-python hands the job an environment that
          # does not include where they live. Without this llmcall reports "cannot run
          # codex (spawn codex ENOENT)" on a machine that has codex in ~/.local/bin.
          export PATH="$HOME/.local/bin:/workspace/tools/bin:$PATH"
          # One candidate per loop item. `for CAND in py -3 python3 python` reads as
          # four words, so it ran `py -c` without its version flag and then tried to
          # execute `-3` as a command; it worked on Windows by accident.
          SRC="${LLMCALL_SRC:-}"
          if [ -z "$SRC" ]; then
            for CAND in "py -3" python3 python; do
              SRC=$($CAND -c "import llmcall, os; print(os.path.dirname(os.path.dirname(llmcall.__file__)))" 2>/dev/null) && [ -n "$SRC" ] && break
              SRC=""
            done
          fi
          [ -z "$SRC" ] && [ -d /workspace/tools/llmcall ] && SRC=/workspace/tools/llmcall
          if [ -z "$SRC" ]; then
            echo "No interpreter on this machine has llmcall; the agent transport will be used."
            exit 0
          fi
          echo "Installing llmcall from $SRC"
          python -m pip install --quiet "$SRC"
          python -c "import llmcall; print('llmcall available to the job')"

      - name: Detect hotspot runtime mode
        id: runtime
        shell: bash
        run: |
          # Through the repository's loader, which reads config.ini AND
          # hotspot.ini. This line used to build its own ConfigParser over
          # config.ini alone, and [HOTSPOT_RUNTIME] lives in hotspot.ini since
          # the config was split by subsystem -- so it found nothing and took
          # the fallback. It happened to be right, because the fallback and the
          # configured value are both "local", which is exactly why nobody
          # noticed: setting runtime = actions would have been ignored in
          # silence and hotspot generation would have gone on being skipped.
          MODE=$(python -c "from arxiv_assistant.utils.config_loader import load_repo_config; print(load_repo_config().get('HOTSPOT_RUNTIME', 'runtime', fallback='local'))")
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Hotspot runtime mode: $MODE"

      - name: Refresh model pricing cache
        shell: bash
        run: |
          python scripts/refresh_model_pricing.py --max-age-hours 24

      - name: Run main
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # `auto` means llmcall when the package imports and the agent transport
          # when it does not. This was pinned to openai because the container runner
          # had neither; it now has both, and the pin has gone from a workaround to
          # the broken choice: measured 2026-09-24 on every machine in the fleet, the
          # openai path answers 429 daily_rotation_quota_exhausted while llmcall
          # answers OK. runner_selftest.yml asks both questions on any machine.
          #
          # A step-level value also outranks a runner's own .env, so a machine that
          # still pins openai for itself is overridden here rather than argued with.
          ARXIV_ASSISTANT_LLM_BACKEND: auto
          # The repo default is gpt-5.6, which this gateway answers with
          # 403 plus_required -- auth is fine, the tier simply cannot have that
          # model. A repository variable, not a secret: a model name is not one,
          # and it has to be changeable without editing six files.
          ARXIV_ASSISTANT_LLM_MODEL: ${{ vars.ARXIV_ASSISTANT_LLM_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          SLACK_KEY: ${{ secrets.SLACK_KEY }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        shell: bash
        run: |
          python main.py

      - name: Generate daily hotspots (deterministic Actions fallback)
        if: ${{ steps.runtime.outputs.mode == 'actions' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # `auto` means llmcall when the package imports and the agent transport
          # when it does not. This was pinned to openai because the container runner
          # had neither; it now has both, and the pin has gone from a workaround to
          # the broken choice: measured 2026-09-24 on every machine in the fleet, the
          # openai path answers 429 daily_rotation_quota_exhausted while llmcall
          # answers OK. runner_selftest.yml asks both questions on any machine.
          #
          # A step-level value also outranks a runner's own .env, so a machine that
          # still pins openai for itself is overridden here rather than argued with.
          ARXIV_ASSISTANT_LLM_BACKEND: auto
          # The repo default is gpt-5.6, which this gateway answers with
          # 403 plus_required -- auth is fine, the tier simply cannot have that
          # model. A repository variable, not a secret: a model name is not one,
          # and it has to be changeable without editing six files.
          ARXIV_ASSISTANT_LLM_MODEL: ${{ vars.ARXIV_ASSISTANT_LLM_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Deterministic degraded path: heuristic mode, agents off, no twitterapi secret.
          python scripts/generate_daily_hotspots.py --output-root out --mode heuristic --force

      - name: Skip hotspot generation (VPS owns it)
        if: ${{ steps.runtime.outputs.mode != 'actions' }}
        shell: bash
        run: echo "runtime=local — hotspot generation runs on VPS; Actions is Publisher-only."

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: arxiv-scanner-outputs
          path: out/
          retention-days: 5
