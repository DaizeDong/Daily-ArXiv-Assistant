name: Push Generated Results

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Run daily arxiv" ]
    types:
      - completed

permissions:
  contents: write

jobs:
  push-results:
    runs-on: [ self-hosted, arxiv-fleet ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: cron_runs.yaml
          workflow_conclusion: success
          name: arxiv-scanner-outputs
          path: artifact_out/
          # arXiv announces nothing on Saturday and Sunday, so the daily run finds zero
          # papers and uploads no artifact. That is a quiet day, not a failure; the step
          # below turns it into a skip instead of a red run every weekend.
          if_no_artifact_found: warn

      - name: Verify artifact /out directory and contents
        shell: bash
        run: |
          if [ -d "artifact_out/out" ] && [ "$(ls -A artifact_out/out)" ]; then
              echo "ARTIFACT_OUT=artifact_out/out" >> "$GITHUB_ENV"
              echo "Contents in artifact_out/out:"
              ls -la artifact_out/out/
          elif [ -d "artifact_out" ] && [ "$(ls -A artifact_out)" ]; then
              echo "ARTIFACT_OUT=artifact_out" >> "$GITHUB_ENV"
              echo "Contents in artifact_out:"
              ls -la artifact_out/
          else
              echo "::notice::no artifact from the daily run (no arXiv announcement today); nothing to push"
              echo "NO_ARTIFACT=true" >> "$GITHUB_ENV"
          fi

      - name: Remove CI-only site build outputs
        if: env.NO_ARTIFACT != 'true'
        shell: bash
        run: |
          rm -rf "${ARTIFACT_OUT}/site" "${ARTIFACT_OUT}/site_html" "${ARTIFACT_OUT}/site_preview"

      - name: Install dependencies
        if: env.NO_ARTIFACT != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Initialize the job model transport
        if: env.NO_ARTIFACT != 'true'
        shell: bash
        run: python scripts/bootstrap_llmcall.py

      - name: Generate monthly summaries
        if: ${{ !cancelled() && env.NO_ARTIFACT != 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Explicit backend: bootstrap validates the installed chain before work starts.
          ARXIV_ASSISTANT_LLM_BACKEND: llmcall
          # The repo default is gpt-5.6, which this gateway answers with
          # 403 plus_required -- auth is fine, the tier simply cannot have that
          # model. A repository variable, not a secret: a model name is not one,
          # and it has to be changeable without editing six files.
          ARXIV_ASSISTANT_LLM_MODEL: ${{ vars.ARXIV_ASSISTANT_LLM_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        shell: bash
        run: |
          python scripts/generate_monthly_summaries.py --output-root "${ARTIFACT_OUT}"

      - name: Checkout to `auto_update` Branch
        if: env.NO_ARTIFACT != 'true'
        shell: bash
        run: |
          git fetch origin
          if ! git show-ref --verify --quiet refs/remotes/origin/auto_update; then
            echo "auto_update branch does not exist. Creating it from main."
            # -B, not -b: a self-hosted runner keeps its workspace between runs,
            # so the local branch survives and -b fails with "already exists".
            git checkout -B auto_update origin/main
            git push origin auto_update
          else
            echo "auto_update branch exists. Checking out to it."
            git checkout -B auto_update origin/auto_update
          fi

      - name: Merge processed artifact contents into tracked /out
        if: env.NO_ARTIFACT != 'true'
        shell: bash
        run: |
          mkdir -p out
          cp -R "${ARTIFACT_OUT}/." out/

#      - name: Debug via Browser
#        uses: fawazahmed0/action-debug-vscode@main
#        with:
#          token: "root"

      - name: Check for changes in /out folder
        if: env.NO_ARTIFACT != 'true'
        id: check_changes
        shell: bash
        run: |
          git add -f out/
          echo "Checking for changes in /out directory..."
          git status
          if git diff --cached --quiet; then
            echo "No changes detected in /out."
            echo "has_changes=false" >> $GITHUB_ENV
          else
            echo "Changes detected in /out."
            echo "has_changes=true" >> $GITHUB_ENV
          fi

      - name: Commit and push /out folder
        if: env.has_changes == 'true' && env.NO_ARTIFACT != 'true'
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "[skip ci] Automated update from workflow: $(date +"%Y-%m-%d %H:%M:%S")"
          git push origin HEAD:auto_update
          echo "Changes in /out pushed to the repository."
